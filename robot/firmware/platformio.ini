; Mulligan robot firmware. See README.md.
;
;   pio test -e native     host tests of everything that makes a decision
;   pio run  -e esp32s3    the firmware for the ESP32-S3-DevKitC-1

[platformio]
default_envs = esp32s3

[env]
test_framework = unity

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit BNO08x@1.2.5
    adafruit/Adafruit INA228 Library@3.0.0

[env:native]
platform = native@1.2.1
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
test_build_src = no
extra_scripts = pre:scripts/gen_vectors.py
