[project]
name = "mulligan-sim"
version = "0.1.0"
description = "Can Mulligan hold its lane? A 2D simulation of skid-steer odometry, gyro and UWB on grass."
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
